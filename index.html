<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>馬拉松跑者 — 實況野球風 3D 跳躍閃避小遊戲</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    body { height: 100vh; height: 100dvh; }
    #canvas-container {
      width: 100%;
      min-height: 0;
      position: relative;
      cursor: pointer;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-container > canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

  </style>
</head>
<body class="flex flex-col">
  <!-- Top Control Bar -->
  <header class="z-20 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2.5 shrink-0">
    <div class="flex items-center gap-2.5">
      <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 font-bold text-xs">3D</span>
      <div>
        <h1 class="text-sm sm:text-base font-semibold text-white leading-tight">馬拉松跑者 3D 跳躍閃避</h1>
        <p class="hidden sm:block text-xs text-slate-400">實況野球 Q 版風格 · 閃避賽道障礙物</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <!-- Camera Presets -->
      <div class="inline-flex rounded-lg bg-slate-800 p-0.5 border border-slate-700 text-xs">
        <button data-cam="angle" class="cam-btn px-2.5 py-1.5 rounded-md bg-sky-500 text-white font-medium transition">45° 立體</button>
        <button data-cam="front" class="cam-btn px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white font-medium transition">正面</button>
        <button data-cam="side" class="cam-btn px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white font-medium transition">側面</button>
        <button data-cam="bib" class="cam-btn px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white font-medium transition">號碼布特寫</button>
      </div>

      <!-- Speed Control -->
      <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
        <span class="text-slate-400">配速</span>
        <input id="speed-slider" type="range" min="0.6" max="2.2" step="0.1" value="1.0" class="w-16 accent-sky-400 cursor-pointer" />
        <span id="speed-val" class="font-mono text-slate-200 w-7">1.0x</span>
      </div>

      <!-- Play / Pause -->
      <button id="btn-play" class="px-3 py-1.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 text-xs font-medium transition flex items-center gap-1.5">
        <span id="play-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="play-label">跑步中</span>
      </button>

      <!-- Mute Toggle -->
      <button id="btn-mute" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition" title="音效開關">🔊 音效</button>

      <!-- Wireframe Toggle -->
      <button id="btn-wire" class="hidden sm:inline-block px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition">線框模式</button>
    </div>
  </header>

  <!-- 3D Viewport -->
  <div id="canvas-container" class="flex-1 relative">
    <!-- Score HUD (Top Left) -->
    <div class="pointer-events-none absolute top-4 left-4 z-10 flex items-center gap-3">
      <div class="bg-slate-900/80 backdrop-blur border border-slate-700/70 rounded-xl px-3.5 py-2 shadow-lg">
        <div class="text-[11px] text-slate-400 font-medium">目前分數</div>
        <div id="score-val" class="text-xl font-black text-amber-300 font-mono leading-tight">0</div>
      </div>
      <div class="bg-slate-900/80 backdrop-blur border border-slate-700/70 rounded-xl px-3.5 py-2 shadow-lg">
        <div class="text-[11px] text-slate-400 font-medium">最高紀錄</div>
        <div id="best-val" class="text-xl font-black text-emerald-300 font-mono leading-tight">0</div>
      </div>
      <div class="bg-slate-900/80 backdrop-blur border border-slate-700/70 rounded-xl px-3.5 py-2 shadow-lg hidden sm:block">
        <div class="text-[11px] text-slate-400 font-medium">已閃避</div>
        <div id="dodge-val" class="text-xl font-black text-sky-300 font-mono leading-tight">0</div>
      </div>
      <div class="bg-slate-900/80 backdrop-blur border border-slate-700/70 rounded-xl px-3.5 py-2 shadow-lg hidden sm:block">
        <div class="text-[11px] text-slate-400 font-medium">補給品</div>
        <div id="supply-val" class="text-xl font-black text-cyan-300 font-mono leading-tight">0</div>
      </div>
      <div class="bg-slate-900/80 backdrop-blur border border-rose-500/40 rounded-xl px-3.5 py-2 shadow-lg">
        <div class="text-[11px] text-rose-300 font-medium">難度等級</div>
        <div id="level-val" class="text-xl font-black text-rose-400 font-mono leading-tight">Lv.1</div>
      </div>
      <div id="bonus-popup" class="opacity-0 transition-all duration-300 bg-cyan-500/90 text-slate-950 font-black text-sm px-3 py-1 rounded-full shadow-lg">+100 補給!</div>
    </div>

    <!-- Bottom Hint -->
    <div class="pointer-events-none absolute bottom-5 left-4 z-10 bg-slate-900/75 backdrop-blur border border-slate-700/70 rounded-xl px-3 py-2 text-xs text-slate-300 hidden sm:block">
      點擊畫面或按 <kbd class="px-1.5 py-0.5 rounded bg-slate-700 text-white font-mono">空白鍵</kbd> 跳躍（支援二段跳）· 難度隨分數持續提升
    </div>


    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="hidden absolute inset-0 z-30 bg-slate-950/65 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 text-2xl mb-3">💥</div>
        <h2 class="text-xl font-bold text-white mb-1">撞到障礙物了！</h2>
        <p class="text-xs text-slate-400 mb-4">#517 HSINHUNG YEH 的馬拉松挑戰結束</p>
        <div class="grid grid-cols-3 gap-2.5 mb-5">
          <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60">
            <div class="text-xs text-slate-400">本次分數</div>
            <div id="final-score" class="text-xl font-black text-amber-300 font-mono">0</div>
          </div>
          <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60">
            <div class="text-xs text-slate-400">閃避障礙</div>
            <div id="final-dodged" class="text-xl font-black text-sky-300 font-mono">0</div>
          </div>
          <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60">
            <div class="text-xs text-slate-400">取得補給</div>
            <div id="final-supply" class="text-xl font-black text-cyan-300 font-mono">0</div>
          </div>
        </div>
        <button id="btn-restart" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-98 text-slate-950 font-bold text-sm transition shadow-lg">
          🔄 再跑一次
        </button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    const btnPlay = document.getElementById('btn-play');
    const playDot = document.getElementById('play-dot');
    const playLabel = document.getElementById('play-label');
    const btnMute = document.getElementById('btn-mute');
    const btnWire = document.getElementById('btn-wire');
    const btnRestart = document.getElementById('btn-restart');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const scoreValEl = document.getElementById('score-val');
    const bestValEl = document.getElementById('best-val');
    const dodgeValEl = document.getElementById('dodge-val');
    const supplyValEl = document.getElementById('supply-val');
    const bonusPopupEl = document.getElementById('bonus-popup');
    const finalSupplyEl = document.getElementById('final-supply');
    const levelValEl = document.getElementById('level-val');
    const finalScoreEl = document.getElementById('final-score');
    const finalDodgedEl = document.getElementById('final-dodged');
    const camBtns = document.querySelectorAll('.cam-btn');

    let isPlaying = true;
    let isGameOver = false;
    let isWireframe = false;
    let isMuted = false;
    let animSpeed = 1.0;

    // Game State
    let score = 0;
    let bestScore = 0;
    let dodgedCount = 0;
    let supplyCount = 0;
    let currentLevel = 1;
    try {
      bestScore = parseInt(localStorage.getItem('marathon_517_best') || '0', 10) || 0;
    } catch {}
    bestValEl.textContent = bestScore;

    // Jump Physics State
    let jumpY = 0;
    let jumpVel = 0;
    let isGrounded = true;
    let jumpCount = 0;
    const MAX_JUMPS = 2;
    const JUMP_FORCE = 9.4;
    const GRAVITY = -25.0;

    // Web Audio API Synthesized SFX (no external audio files)
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }
    function playSfx(type) {
      if (isMuted) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.14);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === 'dodge') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.06);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        osc.frequency.setValueAtTime(1046.5, now + 0.24);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'supply') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.setValueAtTime(880, now + 0.06);
        osc.frequency.setValueAtTime(1174.66, now + 0.12);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.start(now);
        osc.stop(now + 0.24);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.28);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
        osc.start(now);
        osc.stop(now + 0.30);
      }
    }

    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#bde5f8');
    scene.fog = new THREE.FogExp2('#d8f0e4', 0.024);

    const camera = new THREE.PerspectiveCamera(44, container.clientWidth / container.clientHeight, 0.1, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // 2. Orbit Camera State (Default 3/4 Game View so obstacles approaching from +Z are clearly visible)
    const camState = {
      theta: 0.72,
      phi: 1.24,
      radius: 7.4,
      target: new THREE.Vector3(0, 1.15, 1.4),
      targetGoal: new THREE.Vector3(0, 1.15, 1.4),
      thetaGoal: 0.72,
      phiGoal: 1.24,
      radiusGoal: 7.4,
      dragging: false,
      lastX: 0,
      lastY: 0
    };

    function updateCameraImmediate() {
      const sinPhi = Math.sin(camState.phi);
      camera.position.set(
        camState.target.x + camState.radius * sinPhi * Math.sin(camState.theta),
        camState.target.y + camState.radius * Math.cos(camState.phi),
        camState.target.z + camState.radius * sinPhi * Math.cos(camState.theta)
      );
      camera.lookAt(camState.target);
    }
    updateCameraImmediate();

    // Tap / click anywhere on the game screen to jump
    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#gameover-overlay')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      triggerJump();
    });
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      camState.radiusGoal = Math.max(2.6, Math.min(15, camState.radiusGoal + e.deltaY * 0.005));
    }, { passive: false });

    const presets = {
      angle: { theta: 0.72, phi: 1.24, radius: 7.4, target: new THREE.Vector3(0, 1.15, 1.4) },
      front: { theta: 0.06, phi: 1.40, radius: 6.2, target: new THREE.Vector3(0, 1.35, 0) },
      side:  { theta: 1.48, phi: 1.38, radius: 6.2, target: new THREE.Vector3(0, 1.25, 0.8) },
      bib:   { theta: 0.05, phi: 1.48, radius: 2.7, target: new THREE.Vector3(0, 1.32, 0.25) }
    };

    camBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const p = presets[btn.dataset.cam];
        if (!p) return;
        camState.thetaGoal = p.theta;
        camState.phiGoal = p.phi;
        camState.radiusGoal = p.radius;
        camState.targetGoal.copy(p.target);
        camBtns.forEach(b => b.className = 'cam-btn px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white font-medium transition');
        btn.className = 'cam-btn px-2.5 py-1.5 rounded-md bg-sky-500 text-white font-medium transition';
      });
    });

    // 3. Lighting
    const hemiLight = new THREE.HemisphereLight('#e0f2fe', '#94a3b8', 0.9);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight('#fffbeb', 1.25);
    sunLight.position.set(5.5, 10, 6);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 32;
    const d = 8;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight('#bae6fd', 0.45);
    rimLight.position.set(-5, 4, -6);
    scene.add(rimLight);

    // 4. Procedural Canvas Textures
    function createSingletTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#7dd3fc');
      grad.addColorStop(0.5, '#93c5fd');
      grad.addColorStop(0.78, '#d8b4fe');
      grad.addColorStop(1, '#f472b6');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#1e3a8a';
      ctx.font = '900 18px Inter, sans-serif';
      ctx.fillText('RUNNER', 66, 118);
      ctx.fillText('FROM', 66, 138);
      ctx.fillText('TAIWAN', 66, 158);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(66, 168, 52, 34);
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(66, 168, 26, 17);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(79, 176.5, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(190, 150);
      ctx.lineTo(195, 118);
      ctx.lineTo(210, 118);
      ctx.quadraticCurveTo(219, 126, 207, 134);
      ctx.lineTo(193, 134);
      ctx.moveTo(203, 134);
      ctx.lineTo(213, 150);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function createBibTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 350;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 350);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, 504, 342);

      ctx.fillStyle = '#fde047';
      ctx.fillRect(16, 110, 480, 180);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(16, 88, 320, 32);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('TAIWAN MARATHON', 176, 111);

      ctx.fillStyle = '#1e293b';
      ctx.font = '900 32px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('2026 臺灣馬拉松', 28, 62);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(368, 26, 116, 52);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 30px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('全馬', 426, 63);

      ctx.fillStyle = '#1d4ed8';
      ctx.font = '900 128px Inter, sans-serif';
      ctx.fillText('517', 256, 232);

      ctx.fillStyle = '#334155';
      ctx.font = 'bold 34px "Noto Sans TC", sans-serif';
      ctx.fillText('宏', 120, 278);

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 28px Inter, sans-serif';
      ctx.fillText('HSINHUNG YEH', 350, 276);

      ctx.fillStyle = '#64748b';
      ctx.font = '600 18px Inter, sans-serif';
      ctx.fillText('FULL MARATHON · TAIPEI', 256, 324);

      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function createRoadTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b93a7';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 4500; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const v = 110 + Math.floor(Math.random() * 55);
        ctx.fillStyle = `rgb(${v},${v + 4},${v + 12})`;
        ctx.fillRect(x, y, 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 12);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    // 5. Materials Registry
    const allMaterials = [];
    function regMat(mat) {
      allMaterials.push(mat);
      return mat;
    }

    const skinMat = regMat(new THREE.MeshStandardMaterial({ color: '#f7cba8', roughness: 0.65 }));
    const hairMat = regMat(new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.7 }));
    const capMat = regMat(new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.45 }));
    const capLogoMat = regMat(new THREE.MeshStandardMaterial({ color: '#2563eb', roughness: 0.4 }));
    const frameMat = regMat(new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.25 }));
    const lensMat = regMat(new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.1, metalness: 0.35, transparent: true, opacity: 0.84 }));
    const silverMat = regMat(new THREE.MeshStandardMaterial({ color: '#cbd5e1', metalness: 0.85, roughness: 0.2 }));
    const singletMat = regMat(new THREE.MeshStandardMaterial({ map: createSingletTexture(), roughness: 0.55 }));
    const bibMat = regMat(new THREE.MeshStandardMaterial({ map: createBibTexture(), roughness: 0.4 }));
    const shortsMat = regMat(new THREE.MeshStandardMaterial({ color: '#1e2f63', roughness: 0.6 }));
    const sleeveMat = regMat(new THREE.MeshStandardMaterial({ color: '#1b2b58', roughness: 0.55 }));
    const whiteMat = regMat(new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.4 }));
    const shoeGreenMat = regMat(new THREE.MeshStandardMaterial({ color: '#22c55e', roughness: 0.4 }));
    const darkMat = regMat(new THREE.MeshStandardMaterial({ color: '#0f172a', roughness: 0.6 }));
    const coneOrangeMat = regMat(new THREE.MeshStandardMaterial({ color: '#f97316', roughness: 0.45 }));
    const hurdleRedMat = regMat(new THREE.MeshStandardMaterial({ color: '#ef4444', roughness: 0.45 }));
    const drinkBlueMat = regMat(new THREE.MeshStandardMaterial({ color: '#06b6d4', roughness: 0.25, emissive: '#0891b2', emissiveIntensity: 0.25 }));
    const energyGoldMat = regMat(new THREE.MeshStandardMaterial({ color: '#facc15', roughness: 0.3, emissive: '#ca8a04', emissiveIntensity: 0.25 }));

    // 6. Environment: Road, Grass Verges, Trees, Pampas Grass, Bokeh
    const roadTex = createRoadTexture();
    const roadMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(8.5, 48),

    // 9. Jump & Game Actions
    function triggerJump() {
      if (isGameOver || !isPlaying) return;
      if (isGrounded || jumpCount < MAX_JUMPS) {
        jumpVel = jumpCount === 0 ? JUMP_FORCE : JUMP_FORCE * 0.90;
        isGrounded = false;
        jumpCount += 1;
        playSfx('jump');
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      playSfx('hit');
      const finalScore = Math.floor(score);
      if (finalScore > bestScore) {
        bestScore = finalScore;
        bestValEl.textContent = bestScore;
        try {
          localStorage.setItem('marathon_517_best', String(bestScore));
        } catch {}
      }
      finalScoreEl.textContent = finalScore;
      finalDodgedEl.textContent = dodgedCount;
      finalSupplyEl.textContent = supplyCount;
      gameoverOverlay.classList.remove('hidden');
    }

      clearObstacles();
      clearSupplies();
      score = 0;
      dodgedCount = 0;
      supplyCount = 0;
      supplyTimer = 1.6;
      jumpY = 0;
      jumpVel = 0;
      isGrounded = true;
      jumpCount = 0;
      currentLevel = 1;
      levelValEl.textContent = 'Lv.1';
      spawnTimer = 1.0;
      isGameOver = false;
      isPlaying = true;

      scoreValEl.textContent = '0';
      dodgeValEl.textContent = '0';
      supplyValEl.textContent = '0';
      playDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
      playLabel.textContent = '跑步中';

      gameoverOverlay.classList.add('hidden');
    }

    // 10. Main Animation & Game Loop
    let clockTime = 0;
    let lastNow = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastNow) / 1000);
      lastNow = now;

      // Smooth Camera Damping
      camState.theta += (camState.thetaGoal - camState.theta) * 0.1;
      camState.phi += (camState.phiGoal - camState.phi) * 0.1;
      camState.radius += (camState.radiusGoal - camState.radius) * 0.1;
      camState.target.lerp(camState.targetGoal, 0.1);
      updateCameraImmediate();

      const active = isPlaying && !isGameOver;
      const newLevel = 1 + Math.floor((score + dodgedCount * 25) / 380);
      if (active && newLevel > currentLevel) {
        currentLevel = newLevel;
        levelValEl.textContent = 'Lv.' + currentLevel;
        showBonusPopup('🔥 Lv.' + currentLevel + ' 速度提升!');
        playSfx('levelup');
      }

      const difficultyBoost = 1 + Math.min(1.65, (currentLevel - 1) * 0.16 + dodgedCount * 0.012);
      const effectiveSpeed = animSpeed * difficultyBoost;
      const runWorldSpeed = 4.6 * effectiveSpeed;

      if (active) {
        clockTime += dt * effectiveSpeed;
        score += dt * 15 * effectiveSpeed;
        scoreValEl.textContent = Math.floor(score);

        // Jump Physics
        if (!isGrounded) {
          jumpY += jumpVel * dt;
          jumpVel += GRAVITY * dt;
          if (jumpY <= 0) {
            jumpY = 0;
            jumpVel = 0;
            isGrounded = true;
            jumpCount = 0;
          }
        }

        // Progressive Obstacle Spawning (faster & harder varieties at higher levels)
        spawnTimer -= dt * effectiveSpeed;
        if (spawnTimer <= 0) {
          const r = Math.random();
          if (currentLevel >= 4 && r < 0.30) {
            createObstacle('tall_hurdle');
          } else if (currentLevel >= 2 && r < 0.55) {
            createObstacle('double_cone');
          } else {
            createObstacle(r < 0.78 ? 'cone' : 'hurdle');
          }
          const minGap = Math.max(0.62, 1.38 - (currentLevel - 1) * 0.10);
          const randGap = Math.max(0.35, 0.90 - (currentLevel - 1) * 0.07);
          spawnTimer = minGap + Math.random() * randGap;
        }

        // Move Obstacles & Check Collisions
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.group.position.z -= dt * runWorldSpeed;

          // Collision Check around z = 0
          if (Math.abs(ob.group.position.z) < ob.hitRadiusZ + 0.18) {
            if (jumpY < ob.hitHeight - 0.12) {
              triggerGameOver();
              break;
            }
          }

          // Passed obstacle safely
          if (!ob.passed && ob.group.position.z < -0.5) {
            ob.passed = true;
            dodgedCount += 1;
            score += 50;
            dodgeValEl.textContent = dodgedCount;
            scoreValEl.textContent = Math.floor(score);
            playSfx('dodge');
          }

          // Remove far behind
          if (ob.group.position.z < -16) {
            scene.remove(ob.group);
            obstacles.splice(i, 1);
          }
        }

        // Supply Spawning (avoid spawning right on top of a new obstacle)
        supplyTimer -= dt * effectiveSpeed;
        if (supplyTimer <= 0) {
          const tooCloseToObs = obstacles.some((ob) => ob.group.position.z > 12.2);
          if (!tooCloseToObs) {
            createSupply();
            supplyTimer = 2.0 + Math.random() * 1.6;
          } else {
            supplyTimer = 0.45;
          }
        }

        // Move & Collect Supplies
        for (let i = supplies.length - 1; i >= 0; i--) {
          const sp = supplies[i];
          sp.group.position.z -= dt * runWorldSpeed;
          sp.group.rotation.y += dt * 3.2;
          sp.group.position.y = sp.baseY + Math.sin(clockTime * 4 + sp.phase) * 0.08;

          // Collection check against runner center
          const runnerCenterY = jumpY + 0.78;
          if (Math.abs(sp.group.position.z) < 0.55 && Math.abs(runnerCenterY - sp.baseY) < 0.85) {
            score += sp.points;
            supplyCount += 1;
            scoreValEl.textContent = Math.floor(score);
            supplyValEl.textContent = supplyCount;
            showBonusPopup(sp.label);
            playSfx('supply');
            scene.remove(sp.group);
            supplies.splice(i, 1);
            continue;
          }

          if (sp.group.position.z < -16) {
            scene.remove(sp.group);
            supplies.splice(i, 1);
          }
        }

        // Scroll Road, Leaves, Trees, Pampas Grass, Bokeh backward (-Z)
        roadTex.offset.y += (dt * runWorldSpeed) / 4.0;

        roadLeaves.forEach((leaf) => {
          leaf.position.z -= dt * runWorldSpeed;
          if (leaf.position.z < -18) {
            leaf.position.z = 8 + Math.random() * 4;
            leaf.position.x = (Math.random() - 0.5) * 6.4;
          }
        });

        bgTrees.forEach((tree) => {
          tree.position.z -= dt * runWorldSpeed * 0.85;
          if (tree.position.z < -22) {
            tree.position.z = 11 + Math.random() * 4;
          }
        });

        pampasClusters.forEach((p) => {
          p.group.position.z -= dt * runWorldSpeed;
          if (p.group.position.z < -16) {
            p.group.position.z = 10 + Math.random() * 4;
          }
        });

        const posArr = bokehGeo.attributes.position.array;
        for (let i = 0; i < bokehCount; i++) {
          posArr[i * 3 + 2] -= dt * runWorldSpeed * 0.5;
          if (posArr[i * 3 + 2] < -14) {
            posArr[i * 3 + 2] = 9 + Math.random() * 3;
          }
        }
        bokehGeo.attributes.position.needsUpdate = true;
      }

      // Runner Pose Kinematics (Running vs Airborne Jump Pose)
      const cycle = clockTime * 6.5;
      const stride = Math.sin(cycle);
      const strideOpp = Math.sin(cycle + Math.PI);

      if (!isGrounded) {
        hipGroup.position.y = 0.92 + jumpY;
        torsoGroup.rotation.x = 0.14;
        torsoGroup.rotation.y = 0;
        headGroup.rotation.y = 0;

        // Raised Power Pros Jump Arms
        rightArm.shoulder.rotation.x = -2.1;
        rightArm.shoulder.rotation.z = -0.35;
        rightArm.elbow.rotation.x = -0.5;
        leftArm.shoulder.rotation.x = -2.1;
        leftArm.shoulder.rotation.z = 0.35;
        leftArm.elbow.rotation.x = -0.5;

        // Tucked Jump Legs
        rightLeg.hip.rotation.x = -0.65;
        rightLeg.knee.rotation.x = 1.05;
        leftLeg.hip.rotation.x = -0.45;
        leftLeg.knee.rotation.x = 0.95;
      } else {
        hipGroup.position.y = 0.92 + Math.abs(Math.sin(cycle)) * 0.10;
        torsoGroup.rotation.x = 0.08 + Math.cos(cycle * 2) * 0.02;
        torsoGroup.rotation.y = stride * 0.08;
        headGroup.rotation.y = -stride * 0.06;

        rightArm.shoulder.rotation.x = stride * 0.65 - 0.15;
        rightArm.shoulder.rotation.z = -0.22;
        rightArm.elbow.rotation.x = -1.35 + stride * 0.15;
        rightArm.elbow.rotation.z = 0.25;

        leftArm.shoulder.rotation.x = strideOpp * 0.65 - 0.15;
        leftArm.shoulder.rotation.z = 0.22;
        leftArm.elbow.rotation.x = -1.35 + strideOpp * 0.15;
        leftArm.elbow.rotation.z = -0.25;

        rightLeg.hip.rotation.x = strideOpp * 0.58 - 0.1;
        rightLeg.knee.rotation.x = Math.max(0.08, Math.sin(cycle + 0.8) * 0.95 + 0.45);

        leftLeg.hip.rotation.x = stride * 0.58 - 0.1;
        leftLeg.knee.rotation.x = Math.max(0.08, Math.sin(cycle + Math.PI + 0.8) * 0.95 + 0.45);
      }

      // Ground Shadow Scales Down When Airborne
      const shadowScale = Math.max(0.35, (1.0 - Math.abs(Math.sin(cycle)) * 0.12) * (1.0 - jumpY * 0.28));
      shadowDisc.scale.set(shadowScale, shadowScale, 1);

      // Swaying Pampas Grass
      pampasClusters.forEach((p) => {
        p.group.rotation.z = p.baseRotZ + Math.sin(clockTime * 1.8 + p.phase) * 0.06;
      });

      bokehPoints.position.y = Math.sin(clockTime * 0.9) * 0.15;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    function resizeView() {
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', resizeView);
    if (window.ResizeObserver) new ResizeObserver(resizeView).observe(container);
  </script>
</body>
